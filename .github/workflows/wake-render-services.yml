name: Wake Render Services

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wake hosted Render services
        run: node scripts/wake-hosted-services.js
